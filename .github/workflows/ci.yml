name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README in sync with marketplace.json
        run: python3 scripts/readme.py --check
      - name: Vendored kernel in sync with lib/_kernel.py
        run: python3 scripts/kernel-sync.py --check
      - name: Run plugin test suites
        run: bash scripts/run-tests.sh

  notify-website:
    name: Redeploy the marketplace site
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch (skills-updated) to username-workspace/website
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::WEBSITE_DISPATCH_TOKEN is not set — the site keeps its previous build until the next website deploy"
            exit 0
          fi
          gh api repos/username-workspace/website/dispatches \
            -f event_type=skills-updated \
            -f "client_payload[sha]=$GITHUB_SHA"
